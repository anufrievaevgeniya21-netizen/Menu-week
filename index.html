<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#28694e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest"><title>Меню на неделю</title>
<style>
:root{--green:#28694e;--bg:#f4f7f3;--card:#fff;--ink:#1e2922;--muted:#69756d;--line:#dce5dd;--soft:#e8f1e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}header{background:var(--green);color:#fff;padding:20px 17px 18px;border-radius:0 0 22px 22px}header h1{font-size:24px;margin:0 0 4px}header p{margin:0;font-size:13px;opacity:.88}.wrap{max-width:760px;margin:auto;padding:14px}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:12px;font-size:13px}.tabs button.active{background:var(--soft);color:var(--green);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 2px 8px #18382008}.card h2{font-size:18px;margin:0 0 5px}.muted{font-size:13px;color:var(--muted)}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}button{font:inherit;cursor:pointer}button.primary,.primary{background:var(--green);color:#fff;border:0;border-radius:11px;padding:12px 14px;font-weight:650}button.secondary{background:var(--soft);color:var(--green);border:0;border-radius:10px;padding:10px 12px}button.danger{background:#fff0ef;color:#a2322b;border:0;border-radius:9px;padding:8px 10px}.day{padding:12px 0;border-top:1px solid var(--line)}.day:first-of-type{border-top:0}.day h3{font-size:15px;margin:0 0 8px}.mealgrid{display:grid;grid-template-columns:1fr;gap:8px}.meal label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.meal select{padding:10px;font-size:14px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.stat{padding:12px;border-radius:13px;background:var(--soft)}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:2px}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.check input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0}.check .name{flex:1}.check small{display:block;color:var(--muted)}.check b{white-space:nowrap}.done .name{text-decoration:line-through;color:var(--muted)}.recipe{border-top:1px solid var(--line);padding:12px 0}.recipe:first-child{border-top:0}.recipe h3{margin:0;font-size:15px}.ingredient{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tiny{font-size:12px;color:var(--muted)}.hide{display:none!important}.installhint{background:#fff8df;border:1px solid #f0df9b;border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(min-width:620px){.mealgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>🍲 Меню на неделю</h1><p>Планируй блюда · собирай покупки автоматически</p></header>
<main class="wrap">
<div id="installhint" class="installhint hide">Чтобы установить приложение: открой меню браузера и выбери «Добавить на главный экран».</div>
<section id="shopping"></section><section id="menu" class="hide"></section><section id="recipes" class="hide"></section>
</main>
<nav class="tabs"><button data-tab="shopping" class="active">🛒<br>Покупки</button><button data-tab="menu">📅<br>Меню</button><button data-tab="recipes">📖<br>Рецепты</button></nav>
<script>
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'], MEALS=['Завтрак','Обед','Ужин'];
const seedRecipes=[
{dish:'Овсяная каша',items:[['Овсяные хлопья',100,'г'],['Молоко',300,'мл'],['Банан',1,'шт.']]},
{dish:'Яичница с сосисками',items:[['Яйца',4,'шт.'],['Сосиски',2,'шт.']]},
{dish:'Курица с рисом',items:[['Куриное филе',300,'г'],['Рис',120,'г'],['Морковь',80,'г'],['Масло растительное',10,'мл']]},
{dish:'Куриный суп',items:[['Куриное филе',250,'г'],['Картофель',200,'г'],['Морковь',80,'г'],['Лук',50,'г']]},
{dish:'Чечевичное рагу',items:[['Чечевица',160,'г'],['Морковь',100,'г'],['Лук',80,'г'],['Масло растительное',10,'мл']]}
];
function fresh(){return {people:2,menu:Array.from({length:7},()=>Array(3).fill('')),recipes:seedRecipes.map(r=>({...r,items:r.items.map(x=>[...x])})),checked:{}}}
let state;try{state=JSON.parse(localStorage.getItem('weeklyMenuApp'))||fresh()}catch(e){state=fresh()}
function save(){localStorage.setItem('weeklyMenuApp',JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dishes(){return state.recipes.map(r=>r.dish).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ru'))}
function options(current){return '<option value="">— Не выбрано —</option>'+dishes().map(d=>`<option ${d===current?'selected':''} value="${esc(d)}">${esc(d)}</option>`).join('')}
function totals(){let out={};state.menu.forEach(day=>day.forEach(dish=>{if(!dish)return;let r=state.recipes.find(x=>x.dish===dish);if(!r)return;r.items.forEach(([product,qty,unit])=>{let k=product.trim().toLocaleLowerCase('ru')+'|'+unit;if(!out[k])out[k]={product,unit,qty:0};out[k].qty+=Number(qty||0)/2*state.people})}));return Object.values(out).sort((a,b)=>a.product.localeCompare(b.product,'ru'))}
function render(){save();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));['shopping','menu','recipes'].forEach(id=>document.getElementById(id).classList.toggle('hide',id!==active));if(active==='shopping')renderShopping();if(active==='menu')renderMenu();if(active==='recipes')renderRecipes()}
let active='shopping';
function renderShopping(){let rows=totals();let bought=rows.filter(r=>state.checked[r.product+'|'+r.unit]).length;let el=document.getElementById('shopping');el.innerHTML=`<div class="statgrid"><div class="stat"><span>Продуктов в списке</span><strong>${rows.length}</strong></div><div class="stat"><span>Уже куплено</span><strong>${bought} / ${rows.length}</strong></div></div><div class="card"><h2>Список покупок</h2><p class="muted">На ${state.people} ${state.people===1?'человека':'человек'}. Отмечай продукты прямо в магазине.</p>${rows.length?rows.map(r=>{let k=r.product+'|'+r.unit,done=!!state.checked[k];return `<label class="check ${done?'done':''}"><input type="checkbox" data-check="${esc(k)}" ${done?'checked':''}><span class="name">${esc(r.product)}</span><b>${Number(r.qty.toFixed(2))} ${esc(r.unit)}</b></label>`}).join(''):'<div class="empty">Список пока пуст.<br>Открой «Меню» и выбери блюда.</div>'}<div class="actions"><button class="secondary" id="copy">Копировать список</button><button class="secondary" id="uncheck">Снять отметки</button></div></div><div class="card"><h2>Настройки</h2><div class="field"><label>Количество человек</label><select id="people">${[1,2,3,4,5,6].map(n=>`<option ${n===state.people?'selected':''} value="${n}">${n}</option>`).join('')}</select></div><div class="tiny">Все количества рассчитываются по рецептам, указанным на 2 порции.</div></div>`;
el.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{state.checked[c.dataset.check]=c.checked;render()});el.querySelector('#people').onchange=e=>{state.people=+e.target.value;render()};el.querySelector('#uncheck').onclick=()=>{state.checked={};render()};el.querySelector('#copy').onclick=async(e)=>{let txt=rows.map(r=>`${state.checked[r.product+'|'+r.unit]?'[x]':'[ ]'} ${r.product} — ${Number(r.qty.toFixed(2))} ${r.unit}`).join('\n');try{await navigator.clipboard.writeText(txt);e.target.textContent='Скопировано'}catch(err){prompt('Скопируй список:',txt)}};
}
function renderMenu(){let el=document.getElementById('menu');el.innerHTML=`<div class="card"><h2>Меню на 7 дней</h2><p class="muted">Выбери блюда. Список покупок обновится автоматически.</p><div class="field"><label>Количество человек</label><select id="people">${[1,2,3,4,5,6].map(n=>`<option ${n===state.people?'selected':''} value="${n}">${n}</option>`).join('')}</select></div></div><div class="card">${DAYS.map((day,i)=>`<div class="day"><h3>${day}</h3><div class="mealgrid">${MEALS.map((m,j)=>`<div class="meal"><label>${m}</label><select data-day="${i}" data-meal="${j}">${options(state.menu[i][j])}</select></div>`).join('')}</div></div>`).join('')}<div class="actions"><button class="primary" id="to-shopping">Перейти к покупкам</button><button class="secondary" id="clear">Очистить меню</button></div></div>`;
el.querySelector('#people').onchange=e=>{state.people=+e.target.value;render()};el.querySelectorAll('[data-day]').forEach(s=>s.onchange=()=>{state.menu[+s.dataset.day][+s.dataset.meal]=s.value;render()});el.querySelector('#to-shopping').onclick=()=>{active='shopping';render()};el.querySelector('#clear').onclick=()=>{if(confirm('Очистить всё меню на неделю?')){state.menu=Array.from({length:7},()=>Array(3).fill(''));state.checked={};render()}}}
function renderRecipes(){let el=document.getElementById('recipes');el.innerHTML=`<div class="card"><h2>Добавить рецепт</h2><p class="muted">Укажи ингредиенты на 2 порции. Для нового блюда сначала добавь первый ингредиент, затем остальные под тем же названием.</p><form id="form"><div class="field"><label>Название блюда</label><input name="dish" required placeholder="Например, Курица с рисом"></div><div class="field"><label>Ингредиент</label><input name="product" required placeholder="Например, Куриное филе"></div><div class="grid2"><div class="field"><label>Количество</label><input name="qty" type="number" min=".01" step="any" required placeholder="300"></div><div class="field"><label>Единица</label><select name="unit">${['г','кг','мл','л','шт.','ч. л.','ст. л.'].map(u=>`<option>${u}</option>`).join('')}</select></div></div><button class="primary" style="width:100%">＋ Добавить ингредиент</button></form></div><div class="card"><h2>Мои рецепты</h2>${state.recipes.length?state.recipes.map((r,i)=>`<div class="recipe"><div class="row between"><h3>${esc(r.dish)}</h3><button class="danger" data-delete="${i}">Удалить</button></div>${r.items.map(x=>`<div class="ingredient"><span>${esc(x[0])}</span><b>${esc(x[1])} ${esc(x[2])}</b></div>`).join('')}</div>`).join(''):'<div class="empty">Добавь первый рецепт.</div>'}</div><div class="card"><h2>Резервная копия</h2><p class="muted">Сохрани свои рецепты и меню в файл, чтобы перенести их на другой телефон.</p><div class="actions"><button class="secondary" id="export">Экспорт данных</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Импорт данных<input id="import" type="file" accept="application/json" style="display:none"></label></div></div>`;
el.querySelector('#form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),dish=String(f.get('dish')).trim(),product=String(f.get('product')).trim(),qty=+f.get('qty'),unit=String(f.get('unit'));let r=state.recipes.find(r=>r.dish.toLocaleLowerCase('ru')===dish.toLocaleLowerCase('ru'));if(!r){r={dish,items:[]};state.recipes.push(r)}if(r.items.some(x=>x[0].toLocaleLowerCase('ru')===product.toLocaleLowerCase('ru')&&x[2]===unit)){alert('Такой ингредиент уже есть в рецепте. Используй другое название или единицу.');return}r.items.push([product,qty,unit]);render()};el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let r=state.recipes[+b.dataset.delete];if(confirm('Удалить рецепт «'+r.dish+'»?')){state.recipes.splice(+b.dataset.delete,1);state.menu.forEach(d=>d.forEach((v,i)=>{if(v===r.dish)d[i]=''}));render()}});el.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='menu-na-nedelyu.json';a.click();URL.revokeObjectURL(url)};el.querySelector('#import').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.recipes||!obj.menu)throw Error();state=obj;render();alert('Данные импортированы')}catch(err){alert('Не удалось импортировать файл. Выбери резервную копию приложения.')}};
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});
if(location.protocol==='file:')document.getElementById('installhint').classList.remove('hide');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
